server:
  port: ${PORT:8082}

spring:
  application:
    name: citas-service

  # Persistencia Reactiva SQL con R2DBC (H2 reactivo por defecto para pruebas y PostgreSQL en produccion)
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:h2:mem:///citasdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_R2DBC_USERNAME:sa}
    password: ${SPRING_R2DBC_PASSWORD:}

  # Inicializacion automatica del esquema reactivo
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  # RabbitMQ para mensajeria asincrona (CloudAMQP)
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:capybara.lmq.cloudamqp.com}
    port: ${SPRING_RABBITMQ_PORT:5671}
    username: ${SPRING_RABBITMQ_USERNAME:vksrrpow}
    password: ${SPRING_RABBITMQ_PASSWORD:sCYgRuF_1iM8nBSW8spJ2R2OkZ79nZC9}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:vksrrpow}
    ssl:
      enabled: true
    listener:
      simple:
        auto-startup: ${SPRING_RABBITMQ_LISTENER_AUTO_STARTUP:true}

# Eureka Client para registro y descubrimiento dinamico
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Configuracion de Colas y Exchanges de RabbitMQ (Especificacion Hospital Vida Salud)
hospital:
  rabbitmq:
    exchange: hospital.exchange
    queue:
      notificaciones: hospital.citas.notificaciones.queue
      auditoria: hospital.citas.auditoria.queue
    routingkey:
      cita-confirmada: cita.confirmada

# URLs de servicios externos para comunicacion sincrona
services:
  pacientes:
    url: ${SERVICES_PACIENTES_URL:http://localhost:8082}

logging:
  level:
    pe.edu.cibertec.hospital: DEBUG
    org.springframework.r2dbc: DEBUG
